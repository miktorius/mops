services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mops
      POSTGRES_USER: mops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mops -d mops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
